<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo Jquery</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    
    <h1 id="titulo">ola!</h1>
    <button id="btn-mudar">mudar texto</button>
    
    <script>
        $(document).ready(function(){
            $("#btn-mudar").click(function(){
                $("#titulo").text("texto alterado com jquery!");
            });
        });
    </script>
</body>
</html>
