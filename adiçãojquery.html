<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exemplo adição jquery </title>
     <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
     <input type="text" id="nova-tarefa" placeholder="Nova tarefa...">
<button id="btn-add">Adicionar Tarefa</button>
<ul id="lista-tarefas"></ul>
</head>
<body>
    <script>
 $(document).ready(function() {
 $('#btn-add').click(function() {
const item = $('#nova-tarefa').val();
if (item !== '') {
 $('#lista-tarefas').append(`<li>${item}</li>`);
 $('#nova-tarefa').val(''); // Limpa o campo
 }
 });
 });
</script>
</body>
</html>
