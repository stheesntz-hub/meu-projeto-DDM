<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exemplo de jquery</title>
     <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
 .card { padding: 10px; border: 1px solid #ccc; background: #f9f9f9; }
 .ativo { background: #d1fae5; border-color: #10b981; font-weight: bold; }
</style>
<div id="card" class="card">Cartão de Exemplo</div>
<button id="btn-estilo">Ativar / Desativar</button>
</head>
<body>
    <script>
 $(document).ready(function() {
    $('#btn-estilo').click(function() {
        $('#card').toggleClass('ativo');
    });
 });
</script>
</body>
</html>
